<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>turtle-art explorer</title>
  <style>
    :root {
      --bg: #f6f4ef; --card: #ffffff; --text: #1f1f1f; --muted: #6b6b6b;
      --border: #dcd7cc; --accent: #e63946; --overlay: rgba(20, 20, 20, 0.92);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d21; --card: #25282d; --text: #e8e6e1; --muted: #9a9a9a;
        --border: #3a3e45; --accent: #f4a261;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 1; padding: 8px 16px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    }
    header label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
    header label[hidden] { display: none; }
    header input[type=number] { width: 6.5em; }
    header select, header input, header button { font: inherit; }
    #status { color: var(--muted); margin-left: auto; }
    button.active { outline: 2px solid var(--accent); }
    main {
      padding: 12px 16px; display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(var(--thumb, 160px), 1fr));
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px;
    }
    .card canvas { display: block; width: 100%; height: auto; cursor: zoom-in; }
    .meta { display: flex; justify-content: space-between; align-items: center;
            color: var(--muted); font-size: 12px; padding: 2px 2px 0; }
    .star { border: 0; background: none; font-size: 18px; line-height: 1;
            cursor: pointer; color: var(--muted); padding: 0 2px; }
    .star.on { color: var(--accent); }
    #sentinel { height: 1px; }
    #empty { padding: 24px 16px; color: var(--muted); }
    #viewer {
      z-index: 2;
      position: fixed; inset: 0; background: var(--overlay); color: #eee;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 12px;
    }
    #viewer[hidden] { display: none; }
    #viewer canvas { max-width: 100%; max-height: calc(100vh - 110px); }
    #viewer .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                   justify-content: center; }
    #viewer code, #screensaver code { color: #ccc; }
    #screensaver {
      z-index: 2;
      position: fixed; inset: 0; background: #111; color: #eee;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; padding: 12px;
      /* The copies around the picture spill past the screen: clip them, so
         they never add scrolling or page size. `clip`, unlike `hidden`,
         cannot be scrolled even by script or keyboard. */
      overflow: clip;
    }
    #screensaver[hidden] { display: none; }
    #saverFrame { position: relative; flex: none; }
    #saverFrame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #screensaver .bar, #screensaver code {
      position: relative; z-index: 1;  /* Above the copies. */
      background: rgba(17, 17, 17, 0.8); padding: 2px 8px; border-radius: 4px;
    }
    #screensaver .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                      justify-content: center; }
    /* HUD off: only the art. */
    #screensaver.no-hud .bar, #screensaver.no-hud code { display: none; }
    #carpet {
      z-index: 2;
      position: fixed; inset: 0; background: #000; color: #eee;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-end; gap: 8px; padding: 12px;
      overflow: clip;  /* Never scrolls, see #screensaver. */
    }
    #carpet[hidden] { display: none; }
    /* While the carpet or the screensaver covers the page, the page behind
       it must not scroll, or its scrollbar shows over the art. :has() picks
       the page by what it contains. */
    html:has(#carpet:not([hidden]), #screensaver:not([hidden])) { overflow: hidden; }
    /* The picture, repeated over the whole window. `pixelated` enlarges each
       tile into a crisp square instead of blurring it. It fades through
       black (#carpet's background) between pictures. */
    #carpetArt {
      position: absolute; inset: 0; background-repeat: repeat;
      image-rendering: pixelated; opacity: 0; transition: opacity 1s;
    }
    #carpetArt.shown { opacity: 1; }
    #carpet .bar, #carpet code {
      position: relative;  /* Above the art. */
      background: rgba(0, 0, 0, 0.8); padding: 2px 8px; border-radius: 4px;
    }
    #carpet .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                   justify-content: center; }
    #carpet code { color: #ccc; }
    #carpet.no-hud .bar, #carpet.no-hud code { display: none; }
    kbd { border: 1px solid #888; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>turtle-art</strong>
    <label>edge
      <select id="edge"><option>wrap</option><option>stop</option></select>
    </label>
    <label title="turtle: tiles get the turtle's color. cycle: each visit advances the tile to its next color (Langton's ant).">paint
      <select id="paint"><option>turtle</option><option>cycle</option></select>
    </label>
    <label>colors <input id="colors" type="number" min="1" max="8"></label>
    <label>history <input id="history" type="number" min="1" max="6"></label>
    <label title="light: colors on off-white. dark: colors on black. Only the colors change, never the walk.">theme
      <select id="theme"><option>light</option><option>dark</option></select>
    </label>
    <label title="Hexagon: hex tiles. Golden rectangle and square: square tiles.">shape
      <select id="shape">
        <option value="hexagon">hexagon</option>
        <option value="golden">golden rectangle</option>
        <option value="square">square</option>
      </select>
    </label>
    <label id="radiusLabel">radius <input id="radius" type="number" min="1" max="150"></label>
    <label id="rowsLabel" title="Rows of square tiles, a Fibonacci number. A golden rectangle's width is the next Fibonacci number (e.g. 21 rows by 34 columns), close to the golden ratio.">rows
      <select id="rows"></select>
    </label>
    <label>steps <input id="steps" type="number" min="1" max="200000" step="1000"></label>
    <label>from seed <input id="start" type="number" min="0" max="4294967295"></label>
    <button id="random" title="Start from a random seed (r)">🎲</button>
    <label title="Hide pictures whose color entropy is below this. Flat fills and tiny loops score near 0.">min interest
      <input id="minEntropy" type="range" min="0" max="2.5" step="0.05">
      <span id="minEntropyValue"></span>
    </label>
    <label>size <input id="thumb" type="range" min="80" max="400" step="10"></label>
    <button id="favoritesButton" title="Show favorites (g)">★ Favorites</button>
    <button id="screensaverButton" title="Hex screensaver: a new animated picture every minute, filling the screen (s)">▶ Hex screensaver</button>
    <button id="carpetButton" title="Carpet: a still golden rectangle tiled over the screen, a new one every 10 seconds (c)">▦ Carpet</button>
    <button id="copyFavorites" hidden title="Copy every favorite as a turtle-art command">Copy as commands</button>
    <span id="status" title="Keys: r random start · g favorites · s screensaver · c carpet · Enter open first picture"></span>
  </header>
  <main id="grid"></main>
  <div id="empty" hidden>No favorites yet. Click ☆ on a picture, or press <kbd>f</kbd> in the viewer.</div>
  <div id="sentinel"></div>

  <div id="viewer" hidden>
    <canvas id="big"></canvas>
    <div class="bar">
      <button id="prev" title="Previous (←)">←</button>
      <button id="fav" title="Favorite (f)">☆</button>
      <button id="next" title="Next (→)">→</button>
      <span id="info"></span>
      <button id="download" title="Download SVG (d)">SVG</button>
      <span id="pngButtons">
        <button data-scale="1" title="Download a pixel-perfect PNG, one pixel per tile (p). Square tiles only.">PNG</button>
        <button data-scale="2" title="Download a pixel-perfect PNG, 2 x 2 pixels per tile.">PNG 2×</button>
        <button data-scale="3" title="Download a pixel-perfect PNG, 3 x 3 pixels per tile.">PNG 3×</button>
      </span>
      <button id="copy" title="Copy command (c)">Copy command</button>
      <button id="close" title="Close (Esc)">✕</button>
    </div>
    <code id="command"></code>
    <div><kbd>←</kbd> <kbd>→</kbd> browse · <kbd>f</kbd> favorite ·
      <kbd>d</kbd> SVG · <kbd>p</kbd> PNG (square tiles) · <kbd>c</kbd> copy command · <kbd>Esc</kbd> close</div>
  </div>

  <div id="screensaver" hidden>
    <div id="saverFrame"></div>
    <div class="bar">
      <span id="saverInfo"></span>
      <button id="saverFav" title="Favorite (f)">☆</button>
      <button id="saverNext" title="Next picture now (n)">⏭</button>
      <button id="saverHud" title="Hide this bar; press h or click the art to bring it back">Hide HUD (h)</button>
      <button id="saverClose" title="Close (Esc)">✕</button>
    </div>
    <code id="saverCommand"></code>
  </div>

  <div id="carpet" hidden>
    <div id="carpetArt"></div>
    <div class="bar">
      <span id="carpetInfo"></span>
      <button id="carpetFav" title="Favorite (f)">☆</button>
      <button id="carpetNext" title="Next picture now (n)">⏭</button>
      <button id="carpetHud" title="Hide this bar; press h or click the art to bring it back">Hide HUD (h)</button>
      <button id="carpetClose" title="Close (Esc)">✕</button>
    </div>
    <code id="carpetCommand"></code>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
